<!doctype html>
<html lang="ru" data-variant="anton1" data-skin="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Что странице разрешено грузить. GitHub Pages свои заголовки не отдаёт, поэтому правило прямо здесь:
     скрипты только наши и телеграмовский, стили только наши и Google Fonts, картинки только наши.
     Если когда-нибудь на страницу попадёт чужой код, увести ответы ему будет некуда. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://telegram.org; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>Путь к себе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>

  :root {
    --ground: #E9EEEA; --surface: #FFFFFF; --sunk: #F3F6F3; --line: #D3DDD6;
    --ink: #1D2824; --muted: #63716B; --accent: #2E6A57; --accent-ink: #FFFFFF; --accent-soft: #DCEAE3;
    --mine: #D6E9DE; --strong: #2F7D52; --improve: #A9701C; --attention: #B04A36;
    --display: "Unbounded", "Onest", system-ui, sans-serif;
    --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121715; --surface: #1B2320; --sunk: #161D1A; --line: #2B3632;
      --ink: #E3EAE6; --muted: #8D9C95; --accent: #7CC0A6; --accent-ink: #0F1a16; --accent-soft: #23372F;
      --mine: #27413A; --strong: #6CC191; --improve: #DDA652; --attention: #E58670;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121715; --surface: #1B2320; --sunk: #161D1A; --line: #2B3632;
    --ink: #E3EAE6; --muted: #8D9C95; --accent: #7CC0A6; --accent-ink: #0F1a16; --accent-soft: #23372F;
    --mine: #27413A; --strong: #6CC191; --improve: #DDA652; --attention: #E58670;
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); padding: 20px 16px 32px; }
  .top { max-width: 1120px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  .top h1 { font: 600 20px/1.2 var(--display); margin: 0; letter-spacing: -0.01em; }
  .top p { margin: 0; color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  /* Чат */
  .chat { background: var(--sunk); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; height: min(780px, calc(100vh - 110px)); min-height: 520px; }
  .chat-head { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .ava { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 13px var(--display); }
  .chat-head b { display: block; font-weight: 600; }
  .chat-head span { color: var(--muted); font-size: 12px; }
  .feed { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
  .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
  .msg.bot { align-self: flex-start; }
  .msg.me { align-self: flex-end; }
  .bubble { background: var(--surface); padding: 9px 12px; border-radius: 14px 14px 14px 4px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 0 var(--line); }
  .me .bubble { background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .bubble .title { font-weight: 600; display: block; margin-bottom: 2px; }
  .bubble .note { color: var(--muted); font-size: 13px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 2px 10px; border-radius: 99px; }
  .kb { display: grid; gap: 4px; }
  .kb .row { display: flex; gap: 4px; }
  .kb button { flex: 1; min-width: 0; font: 500 14px var(--body); color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kb button:hover { background: var(--accent-soft); }
  .kb button.link::after { content: " ↗"; }
  .typing { color: var(--muted); font-style: italic; }
  .ov { display: grid; gap: 8px; margin-top: 6px; }
  .ov-row { display: grid; gap: 1px; }
  .ov-row .l { display: flex; justify-content: space-between; gap: 8px; }
  .ov-row .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ov-row .bar { font-family: var(--mono); letter-spacing: -1px; font-size: 13px; }
  .ov-row .t { color: var(--muted); font-size: 13px; }
  .cmds { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--line); }
  .cmds button { font: 500 12px var(--mono); color: var(--muted); background: var(--sunk); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
  .cmds button:hover { color: var(--accent); }

  /* Кухня */
  .panel { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h2 { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .card p.hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; max-width: 62ch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.num { font-family: var(--mono); }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.STRONG { color: var(--strong); } .chip.IMPROVE { color: var(--improve); } .chip.ATTENTION { color: var(--attention); }
  .trace { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
  .ids { font: 12px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button, .tools button { font: 500 13px var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .presets button:hover, .tools button:hover { border-color: var(--accent); color: var(--accent); }
  .tools { display: grid; gap: 10px; }
  .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input { font: 14px var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  .toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .log { font: 12px/1.7 var(--mono); color: var(--muted); max-height: 170px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  .log li b { color: var(--ink); font-weight: 500; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .feed { scroll-behavior: auto; } }
  [hidden] { display: none !important; }

  /* Переключатель режимов */
  .modes { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .modes button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* Мини-апп */
  .mini { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; height: min(780px, calc(100vh - 110px)); min-height: 520px; }
  .mini-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mini-head .x { color: var(--accent); }
  .mini-head .dots { justify-self: end; color: var(--muted); letter-spacing: 2px; }
  .mini-body { flex: 1; overflow-y: auto; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 16px; }
  .mini-foot { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .mini-foot:has(.mini-main[hidden]) { display: none; }
  .mini-main { width: 100%; font: 600 15px var(--body); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 12px; padding: 13px; cursor: pointer; }
  .m-eyebrow { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .m-h1 { font: 600 26px/1.15 var(--display); letter-spacing: -0.01em; margin: 6px 0 0; text-wrap: balance; }
  .m-lead { font-size: 17px; line-height: 1.45; margin: 0; }
  .m-p { margin: 0; }
  .m-muted { margin: 0; color: var(--muted); font-size: 13px; }
  .m-spheres { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .m-spheres li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .m-spheres li span:last-child { color: var(--muted); font-size: 13px; }
  .m-ticks { display: flex; gap: 3px; }
  .m-ticks i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .m-ticks i:nth-child(3n):not(:last-child) { margin-right: 6px; }
  .m-ticks i.done { background: var(--accent); }
  .m-ticks i.now { background: var(--accent); opacity: 0.4; }
  .m-qmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .m-qmeta b { color: var(--ink); font-weight: 600; }
  .m-sphere { font-size: 12px; color: var(--muted); min-width: 0; }
  .m-sphere b { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .m-count { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .m-intro { margin: 0; padding: 10px 12px; background: var(--sunk); border-radius: 12px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .m-q { font: 600 21px/1.3 var(--body); margin: 0; text-wrap: balance; }
  .m-opts { display: grid; gap: 8px; }
  .m-opt { text-align: left; font: 16px/1.35 var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
  .m-opt:hover { border-color: var(--accent); }
  .m-opt.picked { background: var(--accent-soft); border-color: var(--accent); }
  .m-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
  .m-big b { font: 600 46px/1 var(--display); font-variant-numeric: tabular-nums; }
  .m-sec { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .m-sec h3 { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .m-note { margin: 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 12px; }
  .m-bars { display: grid; gap: 14px; }
  .m-bar-l { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
  .m-bar-l span:last-child { font-variant-numeric: tabular-nums; }
  .m-track { height: 8px; margin: 6px 0 5px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .m-fill { height: 100%; border-radius: 4px; }
  .m-fill.STRONG { background: var(--strong); } .m-fill.IMPROVE { background: var(--improve); } .m-fill.ATTENTION { background: var(--attention); }
  .m-bar-t { font-size: 13px; color: var(--muted); }
  .m-ghost { width: 100%; font: 500 15px var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 11px; cursor: pointer; }
  .m-ghost:hover { background: var(--accent-soft); }
  .m-wait { margin: auto; display: grid; gap: 14px; justify-items: center; text-align: center; color: var(--muted); }
  .m-pulse { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .m-pulse { animation: none; } }

  html, body { margin: 0; padding: 0; background: var(--surface); }
  body { color: var(--ink); font: 15px/1.5 var(--body); }
  /* Высоту задаёт tg-app.js на каждое изменение окна: при сворачивании Telegram меняет размер вебвью */
  /* Отступ сверху отдаёт сам Telegram (safeAreaInset): на айфонах с островком и в полноэкранном
     режиме под его панелью иначе прячется верх экрана */
  .mini { height: var(--app-h, var(--tg-viewport-stable-height, 100vh)); min-height: 0; border: 0; border-radius: 0;
          box-sizing: border-box; padding-top: var(--safe-top, 0px); }
  .mini-head { display: none; }
  .mini-foot { padding-bottom: calc(14px + max(env(safe-area-inset-bottom), var(--safe-bottom, 0px))); }
  /* Телефон гасит системную подсветку тапа и выделение текста: из-за них после ответа
     оставалась серая вспышка, а долгое нажатие поднимало меню «Копировать» и синее выделение. */
  .mini, .mini * { -webkit-tap-highlight-color: transparent; }
  .mini button, .m-q, .m-qmeta, .m-ticks, .m-eyebrow, .m-h1 {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .mini button { touch-action: manipulation; }   /* без задержки 300 мс и без зума по двойному тапу */
  /* Прокрутка внутри не должна тянуть окно Telegram: иначе мини-апп уезжает вниз и закрывается жестом */
  html, body { overscroll-behavior: none; }
  .mini-body { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  /* Экран погас или мини-апп свёрнут: кружок ожидания тоже должен встать, он крутился в фоне */
  html.is-hidden .m-pulse { animation: none !important; }
/*FONTS: https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap*/
/* Вариант Б: три кадра одной сцены от Жоры (ночь, рассвет, день) плавно перетекают друг в друга.
   Камера медленно отъезжает, свет доходит до полного солнца только на 15-м ответе. */
html:root[data-skin="b"] {
  --ground: #0A0907; --surface: #090B12; --sunk: #17130D; --line: #33291C;
  --ink: #F4EDE0; --muted: #A99A83; --accent: #E0A33F; --accent-ink: #1A1206;
  --accent-soft: rgba(224, 163, 63, 0.18);
  --strong: #C8B25A; --improve: #D08F36; --attention: #C2603C;
  --card: rgba(14, 12, 10, 0.72);
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cam: 1.16; --night: 1; --dawn: 0; --day: 0; --haze: 0.2;
  color-scheme: dark;
}
[data-skin="b"] body { background: var(--surface); }
[data-skin="b"] .mini { position: relative; overflow: hidden; background: #090B12; }

[data-skin="b"] .b-scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
/* Камера стоит у пары и с каждым ответом отъезжает к горе: пара уходит вдаль */
[data-skin="b"] .b-layer {
  position: absolute; inset: -3%;
  background-size: cover; background-position: center var(--pos-y, 58%);
  transform: scale(var(--cam));
  transform-origin: 38% 100%;   /* растём от нижнего края: пара поднимается над карточкой, текст не двигаем */
  transition: opacity 1100ms ease, transform 1400ms cubic-bezier(0.25, 0.8, 0.3, 1), background-position 1400ms ease;
  /* will-change убран намеренно: он держал три больших слоя в видеопамяти постоянно,
     из-за этого после разблокировки телефона вебвью подвисал при восстановлении графики */
}
/* Ночь грузится сразу, рассвет и день подгружаются позже: иначе телефон тянет 7 МБ на старте */
[data-skin="b"] .b-night { background-image: url("assets/scene-noch.jpg"); opacity: var(--night); }
[data-skin="b"] .b-dawn  { opacity: var(--dawn); }
[data-skin="b"] .b-day   { opacity: var(--day); }
/* Свечение солнца: растёт с каждым ответом, поэтому шаг света заметен сразу */
[data-skin="b"] .b-glow {
  position: absolute; left: 44%; top: calc(34% - 16% * var(--k, 0)); width: 150%; aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(calc(0.55 + 0.55 * var(--k, 0)));
  background: radial-gradient(circle, rgba(255, 219, 150, 0.6) 0%, rgba(243, 172, 70, 0.28) 34%, rgba(243, 172, 70, 0) 68%);
  opacity: var(--glow, 0); mix-blend-mode: screen; pointer-events: none;
  transition: opacity 900ms ease, transform 1200ms ease;
}
/* Короткая вспышка в момент ответа: свет «пробивается», шаг виден */
/* Осветление идёт одним проходом по всей сцене, а не по каждой фотографии отдельно:
   раньше телефон на каждый ответ обрабатывал три полноэкранных кадра сразу */
[data-skin="b"] .b-scene.is-pulse { animation: bFlash 760ms ease; }
@keyframes bFlash { 0% { filter: brightness(1); } 32% { filter: brightness(1.22) saturate(1.12); } 100% { filter: brightness(1); } }
@media (prefers-reduced-motion: reduce) { [data-skin="b"] .b-scene.is-pulse .b-layer { animation: none; } }

/* Радуга над долиной: появляется к 13-му вопросу, к финалу становится ярче */
/* Настоящая радуга с фотографии Антона: ложится добавочным светом, как в жизни */
[data-skin="b"] .b-rainbow {
  position: absolute; left: 44%; top: -6%; width: 230%; height: auto;
  transform: translateX(-50%) rotate(-5deg);
  opacity: var(--rain, 0); mix-blend-mode: screen;
  filter: saturate(1.15) blur(0.4px);
  pointer-events: none; transition: opacity 1400ms ease;
}
[data-skin="b"] .b-rainbow img { width: 100%; height: auto; display: block; }
/* Пока радуги нет, слой вообще выключен: прозрачный слой с режимом screen всё равно
   заставлял телефон смешивать картинку во весь экран на каждом кадре */
[data-skin="b"] .b-rainbow { display: none; }
[data-skin="b"] .mini.has-rain .b-rainbow { display: block; }

/* лёгкая дымка в долине, чтобы кадр дышал */
[data-skin="b"] .b-haze {
  position: absolute; left: -12%; right: -12%; top: 40%; height: 20%;
  background: linear-gradient(to bottom, rgba(214, 205, 189, 0) 0%, rgba(214, 205, 189, 0.45) 50%, rgba(214, 205, 189, 0) 100%);
  /* blur убран: градиент и так мягкий, а размытие заставляло телефон перерисовывать слой каждый кадр */
  opacity: var(--haze); transition: opacity 1200ms ease;
  animation: bDrift 58s ease-in-out infinite alternate;
}
@keyframes bDrift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
@media (prefers-reduced-motion: reduce) { [data-skin="b"] .b-haze { animation: none; } }
/* Экран заблокирован или мини-апп свёрнут: гасим анимации, чтобы вебвью не грузился впустую */
/* Гасим всю сцену целиком, а не отдельные слои: раньше правило было написано с ошибкой
   и заодно продолжали работать переходы свечения, радуги и логотипа */
[data-skin="b"].is-hidden .b-scene,
[data-skin="b"].is-hidden .b-scene * { animation: none !important; transition: none !important; }

/* карточка снизу: сцена остаётся видимой сверху, пара идёт над ней */
/* Вопрос начинается у верхней кромки карточки, а не жмётся к низу экрана */
[data-skin="b"] .mini-body { position: relative; z-index: 2; justify-content: flex-start; padding: 18px 18px 22px; }
/* Распорка поднимает вопрос к верхней кромке карточки, но сжимается, если текста много:
   иначе на вытянутых экранах вопрос уезжал вниз и приходилось скроллить */
[data-skin="b"] .mini-body::before { content: ""; flex: 0 1 42%; min-height: 0; }
[data-skin="b"] .mini.b-result .mini-body::before { display: none; }
/* Без размытия: фотография должна оставаться чёткой, подложка просто плотная */
[data-skin="b"] .mini::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 54%; z-index: 1;
  background: linear-gradient(to bottom, rgba(14, 12, 10, 0) 0%, var(--card) 16%, var(--card) 100%);
  border-top: 0; border-radius: 0;
}
/* На результате текста много и он прокручивается: подложка на весь экран, иначе не читается на светлом кадре */
[data-skin="b"] .mini.b-result::after {
  height: 100%; border-radius: 0;
  background: linear-gradient(to bottom, rgba(14, 12, 10, 0.5) 0%, rgba(14, 12, 10, 0.88) 18%, rgba(14, 12, 10, 0.94) 100%);
}
[data-skin="b"] .mini-foot { position: relative; z-index: 3; background: transparent; border-top: 0; }
[data-skin="b"] .mini-main { background: linear-gradient(135deg, #F3D68F, #E0A33F 55%, #A9721F); color: var(--accent-ink); font-weight: 700; }

/* Логотип живёт в слое сцены: только там режим screen убирает чёрный фон и остаётся золото.
   Внутри карточки наложение изолируется и получается тёмный квадрат. */
[data-skin="b"] .b-hero { display: grid; justify-items: center; }
[data-skin="b"] .b-scene .b-logo {
  position: absolute; top: 2%; left: 50%; transform: translateX(-50%);
  width: 230px; max-width: 66%; height: auto;
  filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 22px rgba(224, 163, 63, 0.25));
  opacity: 1; pointer-events: none;
  transition: opacity 600ms ease, width 600ms ease, top 600ms ease, left 600ms ease;
}
/* Водяной знак на вопросах: то же место и тот же размер, что на старте, только полупрозрачный */
[data-skin="b"] .b-scene .b-logo.is-mark {
  opacity: 0.42;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
}

/* Низкие экраны: логотип уменьшается, текст уплотняется, чтобы ничего не наслаивалось */
@media (max-height: 780px) {
  [data-skin="b"] .b-scene .b-logo { width: 168px; top: 1%; }
  [data-skin="b"] .m-lead { font-size: 19px; }
  [data-skin="b"] .m-p, [data-skin="b"] .m-note { font-size: 14px; line-height: 1.4; }
  [data-skin="b"] .mini-body { padding: 14px 16px 18px; gap: 12px; }
}
@media (max-height: 680px) {
  [data-skin="b"] .b-scene .b-logo { width: 132px; }
  [data-skin="b"] .m-q { font-size: 25px; }
  [data-skin="b"] .m-opt { font-size: 15px; padding: 11px 12px; }
  [data-skin="b"] .m-spheres li { font-size: 12px; padding: 3px 9px; }
}
[data-skin="b"] .m-eyebrow { color: var(--accent); letter-spacing: 0.2em; }
[data-skin="b"] .m-h1 { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.05; }
[data-skin="b"] .m-lead { font-family: var(--display); font-size: 21px; line-height: 1.3; }
[data-skin="b"] .m-muted, [data-skin="b"] .m-bar-t { color: var(--muted); }
/* Сферы остаются на старте (человек должен понимать, о чём речь), но компактно, строкой,
   чтобы экран помещался целиком и свайпать не приходилось */
[data-skin="b"] .m-spheres { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; border: 0; margin: 4px 0 0; padding: 0; }
[data-skin="b"] .m-spheres li {
  display: inline-flex; border: 1px solid rgba(224, 163, 63, 0.38); border-radius: 99px;
  padding: 4px 11px; font-size: 13px; color: #F1E6D3; background: rgba(224, 163, 63, 0.1);
}
[data-skin="b"] .m-spheres li span:last-child { display: none; }
[data-skin="b"] .m-ticks i { height: 3px; background: rgba(244, 237, 224, 0.18); }
[data-skin="b"] .m-ticks i.done { background: var(--accent); }
[data-skin="b"] .m-ticks i.now { background: var(--accent); opacity: 0.45; }
/* Крупнее и контрастнее: на фотографии мелкий белый текст читался плохо */
/* Полупрозрачная тёмная плашка за подписью сферы: буквы читаются на любом кадре */
[data-skin="b"] .m-sphere {
  background: rgba(12, 10, 8, 0.3);
  border-radius: 8px; padding: 2px 8px;
}
/* Подпись сферы должна цеплять взгляд: жирнее, ярче и с мягким тёмным ореолом поверх фотографии */
[data-skin="b"] .m-sphere b {
  color: #F5C167; font-size: 15px; font-weight: 700; letter-spacing: 0.07em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 0 10px rgba(0, 0, 0, 0.35);
  -webkit-text-stroke: 0.3px rgba(0, 0, 0, 0.22);
}
[data-skin="b"] .m-count { font-size: 14px; color: #D9CDBA; }
[data-skin="b"] .m-q { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.12; color: #FFF8EC; }
[data-skin="b"] .m-opt { font-size: 17px; color: #FBF4E6; background: rgba(28, 23, 18, 0.55); border: 1px solid rgba(244, 237, 224, 0.28); border-radius: 13px; }
/* Подсветку по наведению включаем только там, где есть мышь: на телефоне она залипала после тапа */
@media (hover: hover) { [data-skin="b"] .m-opt:hover { border-color: var(--accent); } }
[data-skin="b"] .m-opt.picked { background: var(--accent-soft); border-color: var(--accent); }
[data-skin="b"] .m-big b { font-family: var(--display); font-size: 62px; color: var(--accent); }
[data-skin="b"] .m-sec { border-top-color: rgba(244, 237, 224, 0.12); }
[data-skin="b"] .m-sec h3 { color: var(--accent); }
[data-skin="b"] .m-note { background: var(--accent-soft); border: 1px solid rgba(224, 163, 63, 0.3); }
[data-skin="b"] .m-track { background: rgba(244, 237, 224, 0.1); }
[data-skin="b"] .m-ghost { color: var(--accent); border-color: rgba(224, 163, 63, 0.35); }

/* Варианты на вопросах Антона (data-variant, 17.09). Его вопросы и ответы в два-три раза длиннее наших:
   вопрос вылезал выше подложки прямо на логотип. Подложка выше, шрифт чуть плотнее, водяной знак меньше.
   Бот (/b/) эти правила не задевают. */
[data-skin="b"][data-variant] .mini:has(.m-q)::after { height: 74%; }
/* Текст вопроса стоит так же низко, как в первом боте: распорка сама сжимается, если ответы длинные,
   и поднимает вопрос ровно настолько, чтобы всё влезло без прокрутки (Александр, 17.09).
   Подложка только на экранах вопросов: раньше правило задевало и стартовый экран,
   текст уезжал вверх и «Диагностика» наезжала на подпись логотипа (замечание Антона, 17.09) */
[data-skin="b"][data-variant] .m-q { font-size: 25px; line-height: 1.15; }
[data-skin="b"][data-variant] .m-opts { gap: 7px; }
[data-skin="b"][data-variant] .m-opt { font-size: 15.5px; line-height: 1.32; padding: 11px 13px; }
[data-skin="b"][data-variant] .b-scene .b-logo.is-mark { width: 128px; opacity: 0.32; }
@media (max-height: 780px) {
  [data-skin="b"][data-variant] .mini:has(.m-q)::after { height: 84%; }
  [data-skin="b"][data-variant] .m-q { font-size: 22px; }
  [data-skin="b"][data-variant] .m-opt { font-size: 14.5px; padding: 9px 12px; }
  [data-skin="b"][data-variant] .b-scene .b-logo.is-mark { width: 104px; }
}

/* Вступительная карточка сферы (вариант для сравнения, 17.09). Текста у Антона больше, чем на вопросе,
   поэтому подложка выше, а распорка короче: сцена остаётся видна сверху, текст читается целиком */
[data-skin="b"] .mini.is-intro .mini-body::before { flex-basis: 24%; }
[data-skin="b"] .mini.is-intro::after { height: 80%; }
[data-skin="b"] .m-intro-title { font-size: 38px; margin-top: 2px; color: #FFF8EC; }
[data-skin="b"] .m-thought { font-size: 22px; line-height: 1.28; color: #F5C167; }
[data-skin="b"] .m-sphere-intro { font-size: 15.5px; line-height: 1.5; color: #EDE3D2; }
@media (max-height: 780px) {
  [data-skin="b"] .mini.is-intro .mini-body::before { flex-basis: 14%; }
  [data-skin="b"] .mini.is-intro::after { height: 88%; }
  [data-skin="b"] .m-intro-title { font-size: 32px; }
  [data-skin="b"] .m-thought { font-size: 19px; }
  [data-skin="b"] .m-sphere-intro { font-size: 14.5px; line-height: 1.45; }
}

/* «Диагностика» на старте второго бота на лёгкой полупрозрачной плашке, как подпись сферы:
   логотип пусть сливается со сценой, а это слово должно читаться (Антон, 17.09) */
[data-skin="b"][data-variant] .b-hero .m-eyebrow {
  background: rgba(12, 10, 8, 0.45); border-radius: 8px; padding: 5px 11px 4px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

</style>

  <div class="mini-head"></div>

</section>
