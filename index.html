<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь к себе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>

  :root {
    --ground: #E9EEEA; --surface: #FFFFFF; --sunk: #F3F6F3; --line: #D3DDD6;
    --ink: #1D2824; --muted: #63716B; --accent: #2E6A57; --accent-ink: #FFFFFF; --accent-soft: #DCEAE3;
    --mine: #D6E9DE; --strong: #2F7D52; --improve: #A9701C; --attention: #B04A36;
    --display: "Unbounded", "Onest", system-ui, sans-serif;
    --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121715; --surface: #1B2320; --sunk: #161D1A; --line: #2B3632;
      --ink: #E3EAE6; --muted: #8D9C95; --accent: #7CC0A6; --accent-ink: #0F1a16; --accent-soft: #23372F;
      --mine: #27413A; --strong: #6CC191; --improve: #DDA652; --attention: #E58670;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121715; --surface: #1B2320; --sunk: #161D1A; --line: #2B3632;
    --ink: #E3EAE6; --muted: #8D9C95; --accent: #7CC0A6; --accent-ink: #0F1a16; --accent-soft: #23372F;
    --mine: #27413A; --strong: #6CC191; --improve: #DDA652; --attention: #E58670;
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); padding: 20px 16px 32px; }
  .top { max-width: 1120px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  .top h1 { font: 600 20px/1.2 var(--display); margin: 0; letter-spacing: -0.01em; }
  .top p { margin: 0; color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  /* Чат */
  .chat { background: var(--sunk); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; height: min(780px, calc(100vh - 110px)); min-height: 520px; }
  .chat-head { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .ava { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 13px var(--display); }
  .chat-head b { display: block; font-weight: 600; }
  .chat-head span { color: var(--muted); font-size: 12px; }
  .feed { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
  .msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
  .msg.bot { align-self: flex-start; }
  .msg.me { align-self: flex-end; }
  .bubble { background: var(--surface); padding: 9px 12px; border-radius: 14px 14px 14px 4px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 0 var(--line); }
  .me .bubble { background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .bubble .title { font-weight: 600; display: block; margin-bottom: 2px; }
  .bubble .note { color: var(--muted); font-size: 13px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 2px 10px; border-radius: 99px; }
  .kb { display: grid; gap: 4px; }
  .kb .row { display: flex; gap: 4px; }
  .kb button { flex: 1; min-width: 0; font: 500 14px var(--body); color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kb button:hover { background: var(--accent-soft); }
  .kb button.link::after { content: " ↗"; }
  .typing { color: var(--muted); font-style: italic; }
  .ov { display: grid; gap: 8px; margin-top: 6px; }
  .ov-row { display: grid; gap: 1px; }
  .ov-row .l { display: flex; justify-content: space-between; gap: 8px; }
  .ov-row .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ov-row .bar { font-family: var(--mono); letter-spacing: -1px; font-size: 13px; }
  .ov-row .t { color: var(--muted); font-size: 13px; }
  .cmds { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--line); }
  .cmds button { font: 500 12px var(--mono); color: var(--muted); background: var(--sunk); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
  .cmds button:hover { color: var(--accent); }

  /* Кухня */
  .panel { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h2 { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .card p.hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; max-width: 62ch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.num { font-family: var(--mono); }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.STRONG { color: var(--strong); } .chip.IMPROVE { color: var(--improve); } .chip.ATTENTION { color: var(--attention); }
  .trace { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
  .ids { font: 12px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button, .tools button { font: 500 13px var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .presets button:hover, .tools button:hover { border-color: var(--accent); color: var(--accent); }
  .tools { display: grid; gap: 10px; }
  .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input { font: 14px var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  .toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .log { font: 12px/1.7 var(--mono); color: var(--muted); max-height: 170px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  .log li b { color: var(--ink); font-weight: 500; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .feed { scroll-behavior: auto; } }
  [hidden] { display: none !important; }

  /* Переключатель режимов */
  .modes { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .modes button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* Мини-апп */
  .mini { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; height: min(780px, calc(100vh - 110px)); min-height: 520px; }
  .mini-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mini-head .x { color: var(--accent); }
  .mini-head .dots { justify-self: end; color: var(--muted); letter-spacing: 2px; }
  .mini-body { flex: 1; overflow-y: auto; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 16px; }
  .mini-foot { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .mini-foot:has(.mini-main[hidden]) { display: none; }
  .mini-main { width: 100%; font: 600 15px var(--body); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 12px; padding: 13px; cursor: pointer; }
  .m-eyebrow { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .m-h1 { font: 600 26px/1.15 var(--display); letter-spacing: -0.01em; margin: 6px 0 0; text-wrap: balance; }
  .m-lead { font-size: 17px; line-height: 1.45; margin: 0; }
  .m-p { margin: 0; }
  .m-muted { margin: 0; color: var(--muted); font-size: 13px; }
  .m-spheres { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .m-spheres li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .m-spheres li span:last-child { color: var(--muted); font-size: 13px; }
  .m-ticks { display: flex; gap: 3px; }
  .m-ticks i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .m-ticks i:nth-child(3n):not(:last-child) { margin-right: 6px; }
  .m-ticks i.done { background: var(--accent); }
  .m-ticks i.now { background: var(--accent); opacity: 0.4; }
  .m-qmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .m-qmeta b { color: var(--ink); font-weight: 600; }
  .m-sphere { font-size: 12px; color: var(--muted); min-width: 0; }
  .m-sphere b { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .m-count { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .m-intro { margin: 0; padding: 10px 12px; background: var(--sunk); border-radius: 12px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .m-q { font: 600 21px/1.3 var(--body); margin: 0; text-wrap: balance; }
  .m-opts { display: grid; gap: 8px; }
  .m-opt { text-align: left; font: 16px/1.35 var(--body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
  .m-opt:hover { border-color: var(--accent); }
  .m-opt.picked { background: var(--accent-soft); border-color: var(--accent); }
  .m-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
  .m-big b { font: 600 46px/1 var(--display); font-variant-numeric: tabular-nums; }
  .m-sec { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .m-sec h3 { font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .m-note { margin: 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 12px; }
  .m-bars { display: grid; gap: 14px; }
  .m-bar-l { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
  .m-bar-l span:last-child { font-variant-numeric: tabular-nums; }
  .m-track { height: 8px; margin: 6px 0 5px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .m-fill { height: 100%; border-radius: 4px; }
  .m-fill.STRONG { background: var(--strong); } .m-fill.IMPROVE { background: var(--improve); } .m-fill.ATTENTION { background: var(--attention); }
  .m-bar-t { font-size: 13px; color: var(--muted); }
  .m-ghost { width: 100%; font: 500 15px var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 11px; cursor: pointer; }
  .m-ghost:hover { background: var(--accent-soft); }
  .m-wait { margin: auto; display: grid; gap: 14px; justify-items: center; text-align: center; color: var(--muted); }
  .m-pulse { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .m-pulse { animation: none; } }

  html, body { margin: 0; padding: 0; background: var(--surface); }
  body { color: var(--ink); font: 15px/1.5 var(--body); }
  .mini { height: var(--tg-viewport-stable-height, 100vh); min-height: 0; border: 0; border-radius: 0; }
  .mini-head { display: none; }
  .mini-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<section class="mini" id="mini" aria-label="Путь к себе">
  <div class="mini-head"></div>
  <div class="mini-body" id="mini-body"></div>
  <div class="mini-foot"><button type="button" class="mini-main" id="mini-main" hidden></button></div>
</section>
<div class="toast" id="toast" hidden></div>
<script src="content-questions.js?v=202609160030"></script>
<script src="content-results.js?v=202609160030"></script>
<script src="logic.js?v=202609160030"></script>
<script src="miniapp.js?v=202609160030"></script>
<script src="tg-app.js?v=202609160030"></script>
</body>
</html>
